<!DOCTYPE html>
<html lang="en" class="bg-[#F8F9FA]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garage Prime - Vehicle Details</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="apple-touch-icon" href="Logo.png">
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Racing+Sans+One&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --orange: #E64A00;
      --cyan: #0891B2;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background-color: var(--bg);
      color: #1F2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: #FAFAFA;
    }
    .brand {
      font-family: 'Racing Sans One', cursive;
      font-size: 18px;
      color: #111827;
      letter-spacing: 1px;
    }
    .badge {
      background: #ECFEFF;
      border: 1px solid #A5F3FC;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }
    .img-container {
      width: 100%;
      height: 250px;
      background: #F3F4F6;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .content {
      padding: 20px;
    }
    .car-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 2px;
      color: #111827;
    }
    .car-series {
      font-size: 12px;
      color: #6B7280;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: #F9FAFB;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .stat-label {
      font-size: 9px;
      color: #9CA3AF;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .stat-val {
      font-size: 13px;
      font-weight: 800;
      color: var(--orange);
    }
    .btn-playstore {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      background: var(--orange);
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(230, 74, 0, 0.2);
      transition: background-color 0.2s, transform 0.2s;
    }
    .btn-playstore:hover {
      background: #C23E00;
      transform: translateY(-1px);
    }
    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #9CA3AF;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="card" id="appCard">
  <div class="header">
    <div class="brand">GARAGE PRIME</div>
    <div class="badge" id="rarityBadge">1:64 MODEL</div>
  </div>

  <div class="img-container" id="imgBox">
    <div class="loading" id="loader">Loading vehicle...</div>
    <img id="carImg" style="display: none;" alt="Car Preview" />
  </div>

  <div class="content" id="mainContent" style="display: none;">
    <div class="car-title" id="carTitle">-</div>
    <div class="car-series" id="carSeries">-</div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Power</div>
        <div class="stat-val" id="statHp">---</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Top Speed</div>
        <div class="stat-val" id="statSpeed">---</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Year</div>
        <div class="stat-val" id="statYear">---</div>
      </div>
    </div>

    <a href="https://play.google.com/store/apps/details?id=com.garageprime.app" class="btn-playstore">
      GET GARAGE PRIME ON GOOGLE PLAY
    </a>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const carId = urlParams.get('id');

  const SUPABASE_URL = 'https://behaycailacyhlyrnorn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlaGF5Y2FpbGFjeWhseXJub3JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMTE0MDEsImV4cCI6MjA4Mzg4NzQwMX0.mg9OdDgYGQmsjGl307f7KBQEIEgcL1ukdyM6c2jmNLk';

  async function loadCar() {
    if (!carId) {
      document.getElementById('loader').innerText = 'No vehicle ID specified.';
      return;
    }

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_public_car_preview?p_id=${carId}`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await response.json();
      
      if (!data || data.length === 0) {
        document.getElementById('loader').innerText = 'Vehicle not found.';
        return;
      }

      const car = data[0];
      document.getElementById('carTitle').innerText = car.modell_name || '1:64 Casting';
      document.getElementById('carSeries').innerText = (car.marke_name ? car.marke_name + ' • ' : '') + (car.sub_series || 'Collection');
      
      if (car.tech_ps) document.getElementById('statHp').innerText = car.tech_ps + ' HP';
      if (car.tech_vmax) document.getElementById('statSpeed').innerText = car.tech_vmax + ' km/h';
      if (car.jahr_release) document.getElementById('statYear').innerText = car.jahr_release;

      if (car.img_url) {
        const img = document.getElementById('carImg');
        img.src = car.img_url;
        img.style.display = 'block';
        document.getElementById('loader').style.display = 'none';
      } else {
        document.getElementById('loader').innerText = 'No photo available';
      }

      document.getElementById('mainContent').style.display = 'block';
    } catch (e) {
      document.getElementById('loader').innerText = 'Error loading vehicle.';
    }
  }

  loadCar();
</script>

</body>
</html>
