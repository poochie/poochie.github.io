<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garage Prime - Fahrzeugdetails</title>
  
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Racing+Sans+One&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0B0D14;
      --card-bg: #151922;
      --orange: #FF5500;
      --cyan: #00E5FF;
      --gold: #FFD700;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body {
      background-color: var(--bg);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 85, 0, 0.1);
      position: relative;
    }
    .header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-family: 'Racing Sans One', sans-serif;
      font-size: 20px;
      color: var(--orange);
      letter-spacing: 1.5px;
    }
    .badge {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }
    .img-container {
      width: 100%;
      height: 250px;
      background: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .content {
      padding: 24px;
    }
    .car-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 4px;
      color: #fff;
    }
    .car-series {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
      margin-bottom: 20px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 15px;
      font-weight: 900;
      color: var(--cyan);
    }
    .btn-playstore {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #FF5500 0%, #FF3300 100%);
      color: #fff;
      text-decoration: none;
      border-radius: 16px;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(255, 85, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-playstore:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 85, 0, 0.6);
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="card" id="appCard">
  <div class="header">
    <div class="brand">GARAGE PRIME</div>
    <div class="badge" id="rarityBadge">HOT WHEELS</div>
  </div>

  <div class="img-container" id="imgBox">
    <div class="loading" id="loader">Lade Fahrzeugdaten...</div>
    <img id="carImg" style="display: none;" alt="Car Preview" />
  </div>

  <div class="content" id="mainContent" style="display: none;">
    <div class="car-title" id="carTitle">-</div>
    <div class="car-series" id="carSeries">-</div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Leistung</div>
        <div class="stat-val" id="statHp">---</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Top Speed</div>
        <div class="stat-val" id="statSpeed">---</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Jahr</div>
        <div class="stat-val" id="statYear">---</div>
      </div>
    </div>

    <a href="https://play.google.com/store/apps/details?id=com.garageprime.app" class="btn-playstore">
      👉 IN DER APP ÖFFNEN / DOWNLOAD
    </a>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const carId = urlParams.get('id');

  const SUPABASE_URL = 'https://behaycailacyhlyrnorn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlaGF5Y2FpbGFjeWhseXJub3JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMTE0MDEsImV4cCI6MjA4Mzg4NzQwMX0.mg9OdDgYGQmsjGl307f7KBQEIEgcL1ukdyM6c2jmNLk';

  async function loadCar() {
    if (!carId) {
      document.getElementById('loader').innerText = 'Keine Fahrzeug-ID angegeben.';
      return;
    }

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/tblVehicles?id=eq.${carId}&select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await response.json();
      
      if (!data || data.length === 0) {
        document.getElementById('loader').innerText = 'Fahrzeug nicht gefunden.';
        return;
      }

      const car = data[0];
      document.getElementById('carTitle').innerText = car.modell || car.modellname || 'Hot Wheels Modell';
      document.getElementById('carSeries').innerText = car.serie || car.sub_series || 'Garage Prime Collection';
      
      if (car.tech_ps) document.getElementById('statHp').innerText = car.tech_ps + ' PS';
      if (car.tech_topspeed) document.getElementById('statSpeed').innerText = car.tech_topspeed + ' km/h';
      if (car.jahr) document.getElementById('statYear').innerText = car.jahr;
      if (car.rarity) document.getElementById('rarityBadge').innerText = car.rarity.toUpperCase();

      const imgUrl = car.img_header_url || car.img_original_url || car.image_url;
      if (imgUrl) {
        const img = document.getElementById('carImg');
        img.src = imgUrl;
        img.style.display = 'block';
        document.getElementById('loader').style.display = 'none';
      } else {
        document.getElementById('loader').innerText = 'Kein Foto hinterlegt';
      }

      document.getElementById('mainContent').style.display = 'block';
    } catch (e) {
      document.getElementById('loader').innerText = 'Fehler beim Laden der Daten.';
    }
  }

  loadCar();
</script>

</body>
</html>
