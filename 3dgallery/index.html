<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Prime - 3D Galerie</title>
    
    <!-- Model-Viewer von Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent: #ff4747; /* Passend zu sportlichen/automotiven Designs */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* 2 Spalten Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #2a2a2a;
        }

        .card-info {
            padding: 15px;
        }

        .card-title {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-subtitle {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Pagination Controls */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            align-items: center;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #333;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Dynamisches Overlay (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-overlay.active {
            display: flex;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        model-viewer {
            width: 90vw;
            height: 80vh;
            max-width: 1200px;
            background-color: transparent;
        }

        .modal-info {
            margin-top: 15px;
            text-align: center;
            font-size: 1.2rem;
        }

        /* Responsive Anpassung für Mobile */
        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr; /* 1 Spalte auf sehr kleinen Bildschirmen */
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>3D Fahrzeug-Galerie</h1>
    </div>

    <div class="gallery-grid" id="gallery-container">
        <!-- Karten werden hier von JavaScript eingefügt -->
    </div>

    <div class="pagination">
        <button id="btn-prev" onclick="changePage(-1)">Zurück</button>
        <span id="page-info">Seite 1</span>
        <button id="btn-next" onclick="changePage(1)">Vor</button>
    </div>

    <!-- Overlay für den 3D Viewer -->
    <div class="modal-overlay" id="modal">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        <model-viewer id="viewer" 
            auto-rotate 
            camera-controls 
            shadow-intensity="1"
            exposure="1">
        </model-viewer>
        <div class="modal-info" id="modal-title">Lade Modell...</div>
    </div>

    <!-- Supabase JS Einbindung -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // Ersetze mit deinen echten Projekt-Daten
        const SUPABASE_URL = 'https://behaycailacyhlyrnorn.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlaGF5Y2FpbGFjeWhseXJub3JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMTE0MDEsImV4cCI6MjA4Mzg4NzQwMX0.mg9OdDgYGQmsjGl307f7KBQEIEgcL1ukdyM6c2jmNLk'
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        // Konfiguration
        let allVehicles = []
        let currentPage = 1
        const itemsPerPage = 8

        // Daten beim Start laden
        async function loadData() {
            // Passe den Tabellennamen (z.B. tblWikiRef) und die Spaltennamen an deine Datenbank an
            // Vorraussetzung: Die Tabelle enthält die Pfade zum Thumbnail und zur .glb Datei
            const { data, error } = await supabase
                .from('tblWikiRef') 
                .select('hersteller, modell, thumbnail_url, glb_url')
                .not('glb_url', 'is', null) // Nur Einträge mit vorhandenem 3D Modell laden

            if (error) {
                console.error('Fehler beim Laden der Daten:', error)
                document.getElementById('gallery-container').innerHTML = '<p>Fehler beim Laden der Galerie.</p>'
                return
            }

            allVehicles = data
            renderPage()
        }

        // Globale Funktionen ans Window-Objekt binden, da type="module" genutzt wird
        window.changePage = function(direction) {
            currentPage += direction
            renderPage()
        }

        window.openModal = function(glbUrl, title) {
            const modal = document.getElementById('modal')
            const viewer = document.getElementById('viewer')
            const titleEl = document.getElementById('modal-title')

            // Wenn es sich um einen Pfad im Storage handelt, die Public URL generieren:
            // const { data } = supabase.storage.from('bucket-name').getPublicUrl(glbUrl)
            // viewer.src = data.publicUrl
            
            // Wenn die glbUrl bereits eine vollständige öffentliche URL in der DB ist:
            viewer.src = glbUrl
            titleEl.textContent = title
            modal.classList.add('active')
        }

        window.closeModal = function() {
            const modal = document.getElementById('modal')
            const viewer = document.getElementById('viewer')
            modal.classList.remove('active')
            viewer.src = '' // Speicher freigeben, wenn geschlossen
        }

        // Seite basierend auf aktueller Seitenzahl rendern
        function renderPage() {
            const container = document.getElementById('gallery-container')
            container.innerHTML = ''

            // Start- und End-Index berechnen
            const startIndex = (currentPage - 1) * itemsPerPage
            const endIndex = startIndex + itemsPerPage
            const pageItems = allVehicles.slice(startIndex, endIndex)

            // Karten generieren
            pageItems.forEach(item => {
                const card = document.createElement('div')
                card.className = 'card'
                
                const title = `${item.hersteller} ${item.modell}`
                
                card.onclick = () => openModal(item.glb_url, title)

                card.innerHTML = `
                    <img src="${item.thumbnail_url || 'platzhalter.jpg'}" alt="${title}" class="card-image">
                    <div class="card-info">
                        <h3 class="card-title">${item.modell}</h3>
                        <p class="card-subtitle">${item.hersteller}</p>
                    </div>
                `
                container.appendChild(card)
            })

            updatePaginationControls()
        }

        // Buttons de/aktivieren
        function updatePaginationControls() {
            const totalPages = Math.ceil(allVehicles.length / itemsPerPage)
            
            document.getElementById('btn-prev').disabled = currentPage === 1
            document.getElementById('btn-next').disabled = currentPage >= totalPages
            
            document.getElementById('page-info').textContent = `Seite ${currentPage} von ${totalPages || 1}`
        }

        // Init
        loadData()
    </script>
</body>
</html>
