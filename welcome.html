<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Prime | Verified</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Racing+Sans+One&display=swap" rel="stylesheet">
    <style>
        body { background-color: #05050A; color: #FFFFFF; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #verified-content { display: none; text-align: center; padding: 40px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 24px; max-width: 400px; }
        .logo { width: 140px; height: 140px; margin-bottom: 20px; }
        h1 { font-family: 'Racing Sans One', cursive; font-size: 3rem; color: #00E5FF; margin: 0 0 15px 0; }
        .user-mail { color: #FF5500; font-weight: 900; }
        .btn { display: inline-block; background: linear-gradient(135deg, #00E5FF 0%, #FF5500 100%); color: #000; text-decoration: none; font-weight: 900; padding: 18px 45px; border-radius: 12px; text-transform: uppercase; margin-top: 30px; }
    </style>
</head>
<body>
    <div id="verified-content">
        <img src="https://behaycailacyhlyrnorn.supabase.co/storage/v1/object/public/garage_images/logos/Logo_Square_Trans.png" class="logo">
        <h1>VERIFIED!</h1>
        <p>The account for <span id="display-email" class="user-mail"></span> is now active.</p>
        <a href="garageprime://confirm" class="btn">LAUNCH APP</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        // Wenn ein Email-Parameter oder ein Access-Token (im Hash) da ist, zeigen wir den Inhalt
        if (urlParams.has('email') || window.location.hash.includes('access_token')) {
            document.getElementById('display-email').textContent = urlParams.get('email') || "your email";
            document.getElementById('verified-content').style.display = 'block';
        }
    </script>
</body>
</html>
