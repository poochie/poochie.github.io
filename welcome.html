<!DOCTYPE html>
<html lang="en" class="bg-[#F8F9FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Prime | Email Verified</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="apple-touch-icon" href="Logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Racing+Sans+One&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F8F9FA; color: #1F2937; font-family: 'Inter', sans-serif; }
        .font-racing { font-family: 'Racing Sans One', cursive; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-[#F8F9FA]">

    <!-- Verified Card -->
    <div id="verified-content" class="hidden text-center p-8 sm:p-10 bg-white border border-gray-200/80 rounded-3xl max-w-md w-full shadow-xl">
        <img src="Logo.png" class="w-16 h-16 mx-auto mb-4 object-contain" alt="Garage Prime Logo" onerror="this.style.display='none'">
        <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-cyan-50 text-cyan-800 border border-cyan-200 mb-3 text-lg font-bold">
            &check;
        </div>
        <h1 class="font-racing text-3xl text-gray-900 mb-2 uppercase tracking-wide">Account Verified!</h1>
        <p class="text-sm text-gray-600 mb-2">The account for <span id="display-email" class="font-bold text-orange-600">your email</span> is now activated.</p>
        <p class="text-xs text-gray-500 mb-6">You can now return to the app and start scanning your garage.</p>
        <a href="garageprime://garage-prime.com/auth1" class="inline-block w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3.5 px-6 rounded-xl transition shadow-sm shadow-orange-200 text-xs uppercase tracking-wider">
            Launch Garage Prime
        </a>
    </div>

    <!-- Error Card -->
    <div id="error-content" class="text-center p-8 bg-white border border-gray-200/80 rounded-3xl max-w-md w-full shadow-xl">
        <h1 class="font-racing text-3xl text-orange-600 mb-2">403</h1>
        <p class="text-sm text-gray-700 font-semibold mb-1">Direct Access Restricted</p>
        <p class="text-xs text-gray-500 mb-6">Please use the verification link sent to your email inbox.</p>
        <a href="index.html" class="inline-block text-xs font-semibold text-orange-600 hover:underline">&larr; Return to Home</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const hasEmail = urlParams.has('email');
        const hasAuth = window.location.hash.includes('access_token');

        if (hasEmail || hasAuth) {
            if(hasEmail) {
                document.getElementById('display-email').textContent = urlParams.get('email');
            }
            document.getElementById('verified-content').style.display = 'block';
            document.getElementById('error-content').style.display = 'none';
        }
    </script>
</body>
</html>
