<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Prime | Engine Started</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Racing+Sans+One&display=swap" rel="stylesheet">
    <style>
        body { background-color: #05050A; color: #FFFFFF; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #verified-content { display: none; text-align: center; padding: 40px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 24px; max-width: 400px; }
        #error-content { text-align: center; color: #FF5500; }
        h1 { font-family: 'Racing Sans One', cursive; font-size: 2.8rem; color: #00E5FF; margin-bottom: 10px; }
        .btn { display: inline-block; background: linear-gradient(135deg, #00E5FF 0%, #FF5500 100%); color: #000; text-decoration: none; font-weight: 900; padding: 18px 40px; border-radius: 12px; text-transform: uppercase; margin-top: 20px; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <!-- Wird nur angezeigt, wenn verifiziert -->
    <div id="verified-content">
        <h1>VERIFIED!</h1>
        <p style="color: #99A1AF;">Your account is active. The pit lane is open for you.</p>
        <a href="garageprime://confirm" class="btn">START ENGINES</a>
    </div>

    <!-- Fallback für direkten Aufruf ohne Token -->
    <div id="error-content">
        <h1>404</h1>
        <p>Access Denied. Please use the link in your email.</p>
    </div>

    <script>
        // Check ob der Parameter status=verified in der URL ist
        const urlParams = new URLSearchParams(window.location.search);
        // Supabase hängt den Token oft nach einem # an, wir prüfen beides:
        if (urlParams.get('status') === 'verified' || window.location.hash.includes('access_token')) {
            document.getElementById('verified-content').style.display = 'block';
            document.getElementById('error-content').style.display = 'none';
        }
    </script>
</body>
</html>
